<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Multi-Plant Simulator</title>
    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --accent: #10b981;
            --text: #f4f4f5;
            --text-dim: #71717a;
            --border: #27272a;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .top-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        .branding h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
        }
        .branding span {
            color: var(--accent);
        }
        .plant-selector-box {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--card);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
        }
        select, input {
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        select option {
            background: var(--bg);
            color: white;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 1rem;
            position: relative;
            transition: all 0.2s;
        }
        .card.interpolating {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .sensor-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }
        .badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 2rem;
            font-weight: 600;
        }
        .badge-online { background: rgba(16,185,129,0.1); color: #10b981; }
        .badge-working { background: rgba(59,130,246,0.1); color: #3b82f6; }
        .value {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 1rem 0;
        }
        .unit { font-size: 1.2rem; color: var(--text-dim); margin-left: 0.25rem; }
        .footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-dim);
            font-family: monospace;
        }
        .controls { margin-top: 4rem; display: flex; gap: 1rem; }
        button {
            background: var(--card);
            border: 1px solid var(--border);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { border-color: var(--accent); }
        .adjust-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }
        .adjust-btn {
            flex: 1;
            padding: 0.4rem;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.1s ease;
        }
        .adjust-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--text-dim);
        }
        .adjust-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="branding">
            <h1>Multi-Plant <span>SIMULATOR</span></h1>
        </div>
        <div class="plant-selector-box">
            <label style="color: var(--text-dim); font-size: 0.8rem; font-weight: 600;">TARGET NODE:</label>
            <select id="plant-select" onchange="changePlant()">
                <!-- Dynamically populated by loadPlants() -->
            </select>
        </div>
    </div>

    <div class="grid" id="grid">
        <!-- Generated Injections -->
    </div>

    <div class="controls">
        <button onclick="forceReset()">Factory Reset Backend</button>
    </div>

    <script>
        let currentPlant = 'ap-1';
        let knownPlants = [];

        async function loadPlants() {
            try {
                const res = await fetch('/active_plants');
                let plants = await res.json();
                
                // Apply alphabetical sorting for user ease
                plants.sort((a, b) => a.label.localeCompare(b.label));
                
                // Check if something changed before refilling to prevent input flicker
                const sig = JSON.stringify(plants);
                const knownSig = JSON.stringify(knownPlants);
                
                if (sig !== knownSig) {
                    knownPlants = plants;
                    const sel = document.getElementById('plant-select');
                    // Preserve current selection if it still exists, otherwise reset to first found
                    const lastVal = currentPlant; 
                    sel.innerHTML = '';
                    
                    if(plants.length === 0) {
                         const opt = document.createElement('option');
                         opt.textContent = 'Searching for nodes...';
                         sel.appendChild(opt);
                         return;
                    }

                    plants.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.label;
                        sel.appendChild(opt);
                    });

                    // Try re-setting chosen value or select first available
                    const idx = plants.findIndex(p => p.id === lastVal);
                    if (idx > -1) {
                        sel.value = lastVal;
                    } else {
                        currentPlant = plants[0].id;
                        sel.value = currentPlant;
                        render(); // force immediate render of first one
                    }
                }
            } catch(e) { console.warn("Node search failed", e); }
        }

        function changePlant() {
            currentPlant = document.getElementById('plant-select').value;
            render();
        }

        async function render() {
            if(!currentPlant || currentPlant === 'Searching for nodes...') return;
            try {
                const res = await fetch(`/sensors/${currentPlant}`);
                if(!res.ok) throw new Error("Offline");
                const data = await res.json();
                const grid = document.getElementById('grid');
                grid.innerHTML = '';

                data.forEach(s => {
                    const isInterp = s.status === 'Interpolating';
                    const card = document.createElement('div');
                    card.className = `card ${isInterp ? 'interpolating' : ''}`;
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="sensor-type">${s.type.replace('_', ' ')}</span>
                            <span class="badge ${isInterp ? 'badge-working' : 'badge-online'}">
                                ${isInterp ? 'ADJUSTING' : 'LIVE'}
                            </span>
                        </div>
                        <div class="value">${s.value}<span class="unit">${s.unit}</span></div>
                        ${isInterp && s.target !== undefined && s.target !== null ? `
                            <div style="font-size: 0.8rem; font-weight: 700; color: #60a5fa; margin-top: -0.5rem; margin-bottom: 1rem;">
                                &rarr; TARGETING ${s.target.toFixed(2)}${s.unit}
                            </div>
                        ` : ''}
                        <div class="adjust-group">
                            <button class="adjust-btn" onclick="adjustValue('${s.type}', ${s.value}, 0.9)">-10%</button>
                            <button class="adjust-btn" onclick="adjustValue('${s.type}', ${s.value}, 1.1)">+10%</button>
                        </div>
                        <div class="footer">
                            <span>${s.id}</span>
                            <span>BAT: ${s.battery}%</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function adjustValue(metricType, currentVal, multiplier) {
            if(!currentPlant) return;
            const newVal = Number((currentVal * multiplier).toFixed(2));
            try {
                await fetch(`/sensors/${currentPlant}/set_value`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ metric: metricType, target: newVal })
                });
                render(); // optimistic visual sync
            } catch (e) { console.error(e); }
        }

        async function forceReset() {
            await fetch('/reset', {method:'POST'});
            render();
        }

        setInterval(render, 1500);
        setInterval(loadPlants, 3000);
        
        // Bootstrapping sequence
        (async () => {
            await loadPlants();
            render();
        })();
    </script>
</body>
</html>
